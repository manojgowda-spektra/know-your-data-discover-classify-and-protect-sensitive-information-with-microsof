<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Zava Microsoft Purview lab architecture</title>
  <desc id="desc">CloudLabs provides access to a hot Windows 11 virtual machine. The virtual machine connects to Microsoft Entra ID and Microsoft Purview. Microsoft Purview works with Microsoft Defender for Endpoint, SharePoint Online, and OneDrive to discover, classify, and protect sensitive information.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#eef7f4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17324d" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#466783"/>
    </marker>
    <style>
      .heading{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#17324d}
      .subheading{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#40566b}
      .label{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#142b3d}
      .detail{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#40566b}
      .small{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#40566b}
      .line{stroke:#466783;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#466783;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
      .card{stroke-width:2;rx:18;filter:url(#shadow)}
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#background)"/>
  <text x="600" y="46" text-anchor="middle" class="heading">Zava Microsoft Purview Lab Architecture</text>
  <text x="600" y="72" text-anchor="middle" class="subheading">Interactive administration from a dedicated, pre-onboarded Windows 11 endpoint</text>

  <rect x="50" y="270" width="220" height="150" class="card" fill="#ffffff" stroke="#3867d6"/>
  <circle cx="95" cy="320" r="22" fill="#3867d6"/>
  <path d="M83 320h24M95 308v24" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="130" y="314" class="label">CloudLabs</text>
  <text x="130" y="338" class="label">access layer</text>
  <text x="75" y="378" class="detail">Lab guide, connection,</text>
  <text x="75" y="399" class="detail">VM controls, and validation</text>

  <rect x="350" y="250" width="250" height="190" class="card" fill="#ffffff" stroke="#0078d4"/>
  <rect x="385" y="286" width="68" height="52" rx="5" fill="#0078d4"/>
  <path d="M400 350h38M419 338v12" stroke="#0078d4" stroke-width="5" stroke-linecap="round"/>
  <text x="475" y="300" class="label">Hot Windows 11 VM</text>
  <text x="475" y="327" class="detail">Microsoft Edge</text>
  <text x="475" y="349" class="detail">PowerShell tooling</text>
  <text x="375" y="390" class="small">Pre-onboarded managed endpoint</text>
  <text x="375" y="414" class="detail">Learner creates all lab evidence</text>

  <rect x="710" y="105" width="210" height="120" class="card" fill="#ffffff" stroke="#6b4ce6"/>
  <circle cx="755" cy="154" r="24" fill="#6b4ce6"/>
  <circle cx="755" cy="146" r="8" fill="#fff"/>
  <path d="M740 174c3-13 27-13 30 0" fill="#fff"/>
  <text x="795" y="150" class="label">Microsoft</text>
  <text x="795" y="175" class="label">Entra ID</text>
  <text x="735" y="205" class="detail">Identity and access</text>

  <rect x="690" y="275" width="250" height="150" class="card" fill="#ffffff" stroke="#008272"/>
  <path d="M730 316c18-18 54-18 72 0v38c-18 20-54 20-72 0z" fill="#008272"/>
  <path d="M748 338l12 12 24-27" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="820" y="323" class="label">Microsoft</text>
  <text x="820" y="348" class="label">Purview</text>
  <text x="715" y="391" class="detail">DLP • Information Protection</text>
  <text x="715" y="412" class="detail">Insider Risk Management</text>

  <rect x="710" y="500" width="230" height="125" class="card" fill="#ffffff" stroke="#d83b01"/>
  <path d="M750 531l34 13v27c0 22-16 34-34 43-18-9-34-21-34-43v-27z" fill="#d83b01"/>
  <path d="M735 568l11 11 20-24" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="800" y="546" class="label">Microsoft Defender</text>
  <text x="800" y="572" class="label">for Endpoint</text>
  <text x="800" y="599" class="detail">Device foundation</text>

  <rect x="990" y="250" width="170" height="115" class="card" fill="#ffffff" stroke="#038387"/>
  <rect x="1015" y="278" width="42" height="42" rx="5" fill="#038387"/>
  <text x="1036" y="307" text-anchor="middle" style="font:700 24px 'Segoe UI',Arial,sans-serif;fill:#fff">S</text>
  <text x="1070" y="292" class="label">SharePoint</text>
  <text x="1070" y="316" class="label">Online</text>
  <text x="1015" y="344" class="detail">Content location</text>

  <rect x="990" y="410" width="170" height="115" class="card" fill="#ffffff" stroke="#0078d4"/>
  <path d="M1012 462c6-18 24-24 38-12 12-10 31-4 33 12 12 0 20 8 20 18h-91c-8-5-8-13 0-18z" fill="#0078d4"/>
  <text x="1070" y="442" class="label">OneDrive</text>
  <text x="1015" y="505" class="detail">Content location</text>

  <path d="M270 345H350" class="line"/>
  <text x="310" y="332" text-anchor="middle" class="small">Secure access</text>
  <path d="M600 310C650 280 660 205 710 170" class="line"/>
  <path d="M600 350H690" class="line"/>
  <text x="645" y="337" text-anchor="middle" class="small">Administer</text>
  <path d="M600 395C650 430 660 520 710 555" class="dash"/>
  <path d="M940 330H990" class="line"/>
  <path d="M940 385C965 400 965 450 990 465" class="line"/>
  <path d="M815 425V500" class="line"/>
  <text x="834" y="468" class="small">Shared onboarding</text>

  <rect x="50" y="655" width="1110" height="42" rx="12" fill="#dfeaf3"/>
  <text x="600" y="681" text-anchor="middle" class="small">Azure RBAC and Azure Policy govern only the VM boundary; Microsoft 365 configuration is managed in its service portals.</text>
</svg>